[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-agent-mcp"
version = "0.1.0"
description = "One-to-one Feishu communication tools and bidirectional agent bridge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.20,<2", "lark-oapi>=1.4,<2", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
feishu-agent = "feishu_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
